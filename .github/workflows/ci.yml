name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go + Python ML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: duitkudw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d duitkudw_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: go test (unit + integration)
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/duitkudw_test?sslmode=disable
          JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
        run: go test -count=1 ./...
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
      - run: uv sync --frozen
      - name: Python unit test (predict.py)
        run: uv run python -m unittest discover -s ml -v

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t duitkudw-backend:ci src/backend
      - run: docker build -t duitkudw-frontend:ci src/frontend
      - name: nginx config valid
        run: docker run --rm duitkudw-frontend:ci nginx -t
