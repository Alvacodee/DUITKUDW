services:
  # 1. DATABASE
  db:
    image: postgres:15-alpine
    container_name: finance_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Hanya bisa diakses dari mesin ini (untuk psql/DBeaver), tidak dari jaringan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. BACKEND
  backend:
    build: ./src/backend
    container_name: finance_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Kosongkan DATABASE_URL di .env untuk memakai container db di atas
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=5432
      - DB_SSLMODE=disable

      - GIN_MODE=release
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # Backend diakses langsung (tanpa reverse proxy) di compose
      - TRUSTED_PROXIES=none

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}

      - JWT_SECRET=${JWT_SECRET}

      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}

  # 3. FRONTEND
  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: finance_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
