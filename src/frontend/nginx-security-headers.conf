# Security headers. Di-include di setiap location karena add_header di dalam
# location menimpa (tidak mewarisi) header dari level server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# connect-src: API backend (https di production, localhost port berapa pun saat docker-compose) & Formspree
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:*; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
