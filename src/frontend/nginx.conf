server {
    listen 80;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Aset hasil build memakai hash di nama file -> aman di-cache lama
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: semua route React diarahkan ke index.html (agar aman saat refresh)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
